<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Tropical Bound - Hawaii Vacation Rentals</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="../../img/favicon.ico" rel="icon">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="../../css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="../../css/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column  poppins background-image-styling"
    style="background-image: url('../../img/background-login.png');">

    <!-- div for the background image -->
    <div class="d-flex w-100 justify-content-center align-items-center border-radius-20">
        <div class="w-100 d-flex flex-column justify-content-center align-items-center ">
            <div class="mb-3 d-flex justify-content-center align-items-center mx-5">
                <img src="../../img/Logo.svg" class="img-fluid " height="ms-auto" alt="logo tropical bound"></img>
            </div>
            <form action="./login.html"
                class="d-flex flex-column justify-content-center align-content-center align-items-center col-11 col-md-6 col-lg-5 col-xl-4 col-xxl-3 pb-5  bg-fifty-six-percent-white border-radius-20">
                <div class="d-flex flex-column justify-content-center align-items-center width-available">
                    <p class="poppins mb-0 text-black fs-2 mt-4 ">Sign Up</p>
                    <p class="text-black mt-4 mb-0">Already have an account ? <a href="./login.html"
                            class="text-decoration-underline text-bold text-black fw-bold">Log In</a></p>

                    <input type="text" id="name"
                        class="input input-outline outline-none border-green rounded-pill px-2 py-2 mt-4 mb-0 width-available mx-4 bg-transparent height-55px"
                        placeholder="Name">
                    <input type="text" id="email"
                        class="input input-outline outline-none border-green rounded-pill px-2 py-2 mt-4 mb-0 width-available mx-4 bg-transparent height-55px"
                        placeholder="Email">

                    <input type="password" id="pwd" name="pwd"
                        class="input input-outline outline-none border-green rounded-pill px-2 py-2 mx-4  mt-4 width-available bg-transparent height-55px "
                        placeholder="Password">

                    <div class=" d-flex flex-row justify-content-between mt-4 width-available mx-4  ">
                        <div class="d-flex form-check">
                            <input class="form-check-input border-red" type="checkbox" value="" id="flexCheckDefault">
                            <label class="d-flex align-items-center form-check-label text-black font-12px fw-500"
                                for="flexCheckDefault">
                                &nbsp; Remember Me
                            </label>
                        </div>
                        <div class="d-flex">
                            <a href="./forgotPassword.html"
                                class="text-black font-12px fw-500 text-decoration-underline">Forgot password ?</a>
                        </div>
                    </div>

                    <div class="d-flex flex-row w-100 mt-4 ">
                        <button type="submit"
                            class="btn width-available outline-none border-0 bg-red rounded-pill mx-4rem text-white bg-red py-2 ">Sign
                            Up</button>

                    </div>
                    <div class="horizontal-line width-available mt-2 mb-0 pb-0 mx-4rem">
                        <span>or</span>
                    </div>
                    <div class="d-flex w-100 mt-2">
                        <button href="" class="width-available rounded-pill bg-white border-0 mx-4rem padding-12px"><img
                                src="../../img/google-icon.png" class="me-2 height-20px "></img>Login with Google
                        </button>
                    </div>
                </div>


            </form>

        </div>
    </div>

    <div class="footer footer--3 mt-5 mb-3">
        <div class="footer__inner">
            <p>Copyright © 2001–2023 Tropicalbound.com™. All rights reserved.</p>
        </div>
    </div>






    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../lib/easing/easing.min.js"></script>
    <!-- Template Javascript -->
    <script src="../../js/main.js"></script>
</body>

</html>
